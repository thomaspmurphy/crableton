[package]
name = "crableton"
version = "0.1.0"
edition = "2024"
description = "A fast Rust MCP server for Ableton Live"
license = "MIT"

[[bin]]
name = "crableton"
path = "src/main.rs"

[lib]
name = "crableton"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "3.2", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
dirs = "6"
quick-xml = "0.37"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
